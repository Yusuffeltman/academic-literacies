<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <link rel="manifest" href="./manifest.json" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Academic Literacies in the Age of AI</title>
  <link rel="icon" type="image/x-icon" href="/favicon.ico" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link
    href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;600;700&family=Lora:ital,wght@0,400;0,500;0,600;1,400&family=Inter:wght@400;500;600;700&family=DM+Mono:wght@400;500&display=swap"
    rel="stylesheet" />
  <script type="module" src="/src/main.js"></script>
  <style>
    :root {
      --navy: #122033;
      --ink: #10213a;
      --amber: #ffb703;
      --amber2: #fb8500;
      --teal: #219ebc;
      --sky: #8ecae6;
      --rose: #f28482;
      --amber-dim: rgba(255, 183, 3, .16);
      --border: rgba(16, 33, 58, .12);
      --cream: #f7f4ee;
      --panel: rgba(255, 255, 255, .82);
      --muted: #5b6b84;
      --radius-sm: 14px;
      --radius-lg: 28px;
      --transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
    }

    *,
    *::before,
    *::after {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: 'Lora', Georgia, serif;
      background: var(--navy, #0f172a);
      min-height: 100vh;
      margin: 0;
    }

    /* Auth styles are in main.css — only minimal pre-render rules here
       to avoid FOUC before the stylesheet loads */
    #auth-screen {
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .auth-form { display: none; }
    .auth-form.on { display: block; }
    #app { display: none; }
  </style>
</head>

<body>
  <div id="auth-screen">
    <div class="auth-box">
      <div class="auth-hero">
        <img src="/logo-icon.png" alt="LitApp AI" class="auth-hero-icon" width="110" height="110" />
        <div class="auth-hero-title">Academic Literacies</div>
        <div class="auth-hero-sub">in the Age of AI</div>
      </div>
      <div class="auth-panel">
        <div class="auth-tabs">
          <button class="auth-tab on" id="tab-login" onclick="switchTab('login')">Student</button>
          <button class="auth-tab" id="tab-reg" onclick="switchTab('reg')" style="display:none;" aria-hidden="true">Staff</button>
        </div>
        <div class="auth-body">
          <div class="auth-form on" id="form-login">
            <div class="auth-field"><label>Personal Email Address</label><input type="text" id="login-email"
                placeholder="e.g. student@gmail.com" /></div>
            <div id="otp-wrap" style="display:none;">
              <div class="auth-field"><label>Sign-in Code</label><input type="text" id="login-otp" inputmode="numeric" autocomplete="one-time-code"
                  placeholder="Enter 6-digit code" maxlength="6" style="text-align:center;font-size:22px;font-weight:700;letter-spacing:6px;" /></div>
            </div>
            <p class="auth-err" id="login-err"></p>
            <p class="auth-success" id="login-success"></p>
            <button class="auth-submit" id="btn-login-link">Send me a sign-in code</button>
            <button class="auth-submit" id="btn-verify-otp" style="display:none;margin-top:8px;">Verify code & sign in</button>
          </div>
          <div class="auth-form" id="form-reg">
            <div class="auth-field"><label>Staff Email Address</label><input type="email" id="reg-username"
                placeholder="e.g. lecturer@domain.com" autocapitalize="none" autocomplete="username" inputmode="email" spellcheck="false" /></div>
            <div class="auth-field">
              <label>Password</label>
              <div class="auth-pass-wrap">
                <input type="password" id="login-pass" placeholder="••••••••"
                  onkeypress="if(event.key==='Enter') document.getElementById('btn-login').click()" />
                <button type="button" class="auth-pass-toggle" onclick="togglePassword('login-pass', this)" aria-label="Show password" title="Show password">👁️</button>
              </div>
            </div>
            <p class="auth-err" id="reg-err"></p>
            <p class="auth-success" id="reg-success"></p>
            <button class="auth-submit" id="btn-login">Sign In</button>
            <button type="button" class="auth-forgot" id="btn-forgot">Forgot password / send reset?</button>
          </div>
        </div>
      </div>
    </div>
  </div>
  <div id="app"></div>
  <script>
    function switchTab(tab) {
      ['login', 'reg'].forEach(t => {
        document.getElementById('form-' + t).classList.toggle('on', t === tab);
        document.getElementById('tab-' + t).classList.toggle('on', t === tab);
      });
    }
    function selectRole(el) {
      document.querySelectorAll('.role-opt').forEach(r => r.classList.remove('active'));
      el.classList.add('active');
    }
    function togglePassword(inputId, btn) {
      const input = document.getElementById(inputId);
      if (!input) return;
      const showing = input.type === 'text';
      input.type = showing ? 'password' : 'text';
      if (btn) {
        btn.textContent = showing ? '👁️' : '🙈';
        btn.setAttribute('aria-label', showing ? 'Show password' : 'Hide password');
        btn.setAttribute('title', showing ? 'Show password' : 'Hide password');
      }
    }

    // Service Worker disabled for Moodle/LMS compatibility
    /*
    if ('serviceWorker' in navigator) { ... }
    */

    // Safety net: if the app hasn't loaded after 30 seconds, show a retry prompt
    // so students don't stare at a blank screen once boot has actually started.
    window._authScreenReady = true;
    window.__ACADEMIC_BOOT_MONITOR = window.__ACADEMIC_BOOT_MONITOR || { pending: false };
    setTimeout(function () {
      var auth = document.getElementById('auth-screen');
      var app = document.getElementById('app');
      var bootPending = Boolean(window.__ACADEMIC_BOOT_MONITOR && window.__ACADEMIC_BOOT_MONITOR.pending);
      // Only show the auth-screen timeout after a real sign-in/bootstrap handoff has started.
      if (bootPending && auth && auth.style.display !== 'none' && auth.style.opacity !== '0') {
        var err = document.getElementById('login-err');
        if (err && !err.textContent) {
          err.textContent = 'The app is taking longer than expected to load. Check your connection and refresh.';
        }
      }
      // If app is showing but empty (loading spinner stuck), offer refresh
      if (app && app.style.display === 'block' && app.querySelector('[style*="spin"]')) {
        app.innerHTML = '<div style="display:flex;align-items:center;justify-content:center;min-height:100vh;background:#0f172a;padding:24px;">' +
          '<div style="text-align:center;max-width:400px;">' +
          '<p style="color:rgba(255,255,255,.6);font-size:14px;font-family:Inter,sans-serif;margin:0 0 16px;">Loading is taking longer than expected.</p>' +
          '<button onclick="location.reload()" style="background:#0d9488;color:#fff;border:none;border-radius:8px;padding:10px 24px;font-size:14px;cursor:pointer;font-family:Inter,sans-serif;">Refresh</button>' +
          '</div></div>';
      }
    }, 30000);
  </script>
</body>

</html>
